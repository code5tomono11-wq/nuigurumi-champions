<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ぬいぐるみチャンピオンズ</title>

<style>

body{
    background:#222;
    color:white;
    text-align:center;
    font-family:sans-serif;
}

h1{
    font-size:48px;
}

#bigCard{
    border:4px solid white;
    width:500px;
    margin:auto;
    padding:20px;
    background:#333;
}

#bigCard img{
    width:250px;
    image-rendering:pixelated;
}

#characterList{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:30px;
}

.charButton{
    background:#444;
    border:3px solid white;
    color:white;
    padding:10px;
    cursor:pointer;
}

.charButton img{
    width:100px;
    image-rendering:pixelated;
}

.charButton:hover{
    background:#666;
}

#team{
    margin-top:30px;
    font-size:24px;
}

</style>

</head>
<body>

<h1>ぬいぐるみチャンピオンズ</h1>

<div id="bigCard">

<img id="bigImage" src="images/pomu.png">

<h2 id="charName">ポム子</h2>

<p id="charInfo">
進化できるバランス型
</p>

</div>

<div id="characterList">

<div class="charButton" onclick="selectChar('chicken')">
<img src="images/chicken.png">
<br>
チキン
</div>

<div class="charButton" onclick="selectChar('kuu')">
<img src="images/kuu.png">
<br>
くうちゃん
</div>

<div class="charButton" onclick="selectChar('pomu')">
<img src="images/pomu.png">
<br>
ポム子
</div>

<div class="charButton" onclick="selectChar('suika')">
<img src="images/suika.png">
<br>
スイカゼリー
</div>

</div>

<br>

<button onclick="addToTeam()">
チームに追加
</button>

<div id="team">

選択チーム

<ul id="teamList"></ul>

</div>
<br>

<button onclick="startBattle()">
バトル開始
</button>

<div id="battle" style="display:none">

<h2>バトル</h2>

<h3 id="enemyName"></h3>

<div style="width:300px;border:2px solid white;margin:auto">
<div id="enemyHpBar"
style="height:20px;background:red;width:100%">
</div>
</div>

<p id="enemyHp"></p>

<img id="enemyImg" width="180">

<hr>

<img id="playerImg" width="180">

<h3 id="playerName"></h3>

<div style="width:300px;border:2px solid white;margin:auto">
<div id="playerHpBar"
style="height:20px;background:lime;width:100%">
</div>
</div>

<p id="playerHp"></p>

<br>

<div id="moves">

<button onclick="useMove1()" id="move1">
技1
</button>

<button onclick="useMove2()" id="move2">
技2
</button>

<button onclick="useMove3()" id="move3">
技3
</button>

<button onclick="useMove4()" id="move4">
技4
</button>
</div>

<br><br>

<button onclick="switchCharacter()">
交代
</button>

<p id="log"></p>

</div>

</div>
<script>
const characters = {

chicken:{
name:"将来有望なケンタッキーのチキン",
img:"images/chicken.png",
info:"コケコッコーで3ターン強化",
hp:95,
atk:22
},

kuu:{
name:"くうちゃん",
img:"images/kuu.png",
info:"おもりキック超高火力",
hp:90,
atk:30
},

pomu:{
name:"ポム子",
img:"images/pomu.png",
info:"へんしんぼうしで進化",
hp:100,
atk:18
},

pomu_hat:{
name:"ポム子（帽子あり）",
img:"images/pomu_hat.png",
info:"ぼうしミサイル",
hp:130,
atk:28
},

suika:{
name:"スイカゼリー",
img:"images/suika.png",
info:"殻の雨・殻盾を使う",
hp:120,
atk:15
}

};
let current="pomu";
let team=[];

function selectChar(id){

current=id;

document.getElementById("bigImage").src=
characters[id].img;

document.getElementById("charName").innerText=
characters[id].name;

document.getElementById("charInfo").innerText=
characters[id].info;
}

function addToTeam(){

if(team.length>=3){

alert("3体選んでいます");

return;
}

team.push(current);

drawTeam();
}

function drawTeam(){

let html="";

team.forEach(c=>{

html+=`<li>${characters[c].name}</li>`;

});

document.getElementById("teamList").innerHTML=
html;
}
let player;
let enemy;

let skipTurn=false;

let currentIndex=0;

let shieldTurns=0;

let enemyTeam=[];

let enemyIndex=0;

function startBattle(){

if(team.length!==3){

alert("3体選んでください");

return;
}

document.getElementById("battle").style.display="block";
currentIndex=0;
player = JSON.parse(
JSON.stringify(
characters[team[0]]
));

enemyTeam=["chicken","kuu","suika"];

enemyIndex=0;

enemy=
JSON.parse(
JSON.stringify(
characters[
enemyTeam[enemyIndex]
]
));
player.maxHp=player.hp;
enemy.maxHp=enemy.hp;

drawBattle();
}

function drawBattle(){

document.getElementById("playerName").innerText=
player.name;

document.getElementById("enemyName").innerText=
enemy.name;

document.getElementById("playerImg").src=
player.img;

document.getElementById("enemyImg").src=
enemy.img;

document.getElementById("playerHp").innerText=
player.hp+" / "+player.maxHp;

document.getElementById("enemyHp").innerText=
enemy.hp+" / "+enemy.maxHp;

document.getElementById("playerHpBar").style.width=
(player.hp/player.maxHp*100)+"%";

document.getElementById("enemyHpBar").style.width=
(enemy.hp/enemy.maxHp*100)+"%";
}

function attack(){

if(skipTurn){

skipTurn=false;

document.getElementById("log").innerText=
"くうちゃんは休んでいる！";

enemyTurn();

return;
}

enemy.hp -= player.atk;

if(enemy.hp<0)
enemy.hp=0;

document.getElementById("log").innerText=
player.name+"の攻撃！";

drawBattle();

if(enemy.hp<=0){

nextEnemy();

return;

}

enemyTurn();
｝
}function specialMove(){

if(player.name==="ポム子"){

player=
JSON.parse(
JSON.stringify(
characters.pomu_hat
));

player.maxHp=player.hp;

document.getElementById("log").innerText=
"ポム子は進化した！";

drawBattle();

return;
}

else if(player.name==="将来有望なケンタッキーのチキン"){

enemy.hp-=45;

}

else if(player.name==="くうちゃん"){

enemy.hp-=70;

skipTurn=true;

document.getElementById("log").innerText=
"おもりキック！次のターン休み！";

}

else if(player.name==="スイカゼリー"){

player.hp+=30;

if(player.hp>player.maxHp)
player.hp=player.maxHp;

enemy.hp-=20;

}

if(enemy.hp<0)
enemy.hp=0;

drawBattle();

if(enemy.hp<=0){

nextEnemy();

return;

}

enemyTurn();

}function nextEnemy(){

enemyIndex++;

if(enemyIndex>=enemyTeam.length){

alert("勝利！！");

return;

}

enemy=
JSON.parse(
JSON.stringify(
characters[
enemyTeam[enemyIndex]
]
));

enemy.maxHp=enemy.hp;

document.getElementById("log").innerText=
enemy.name+"登場！";

drawBattle();

}
function quickAttack(){

enemy.hp-=10;

document.getElementById("log").innerText=
"はやうち！";

drawBattle();

enemyTurn();
}

function healMove(){

player.hp+=20;

if(player.hp>player.maxHp)
player.hp=player.maxHp;

document.getElementById("log").innerText=
"回復した！";

drawBattle();

enemyTurn();
}
function enemyTurn(){

let damage=enemy.atk;

if(shieldTurns>0){

damage=Math.floor(damage/2);

shieldTurns--;

}

player.hp-=damage;

if(player.hp<0)
player.hp=0;

document.getElementById("log").innerText=
enemy.name+"の攻撃！";

drawBattle();

}
function switchCharacter(){

if(currentIndex>=team.length-1){

alert("これ以上交代できない");

return;
}

currentIndex++;

player=
JSON.parse(
JSON.stringify(
characters[
team[currentIndex]
]
));

player.maxHp=player.hp;

drawBattle();

document.getElementById("log").innerText=
player.name+"登場！";

enemyTurn();

}
function useMove1(){

enemy.hp-=20;

drawBattle();

if(enemy.hp<=0){

nextEnemy();

return;

}

enemyTurn();

}

function useMove2(){

enemy.hp-=35;

drawBattle();

if(enemy.hp<=0){

nextEnemy();

return;

}

enemyTurn();

}

function useMove3(){

specialMove();

}
function useMove4(){

if(player.name==="スイカゼリー"){

shieldTurns=3;

document.getElementById("log").innerText=
"スイカの殻盾！";

}
else{

document.getElementById("log").innerText=
"まもる！";

}

enemyTurn();

}
</script>

</body>
</html>
