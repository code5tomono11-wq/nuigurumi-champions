<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ぬいぐるみチャンピオンズ</title>

<style>

body{
    background:#222;
    color:white;
    text-align:center;
    font-family:sans-serif;
}

h1{
    font-size:48px;
}

#bigCard{
    border:4px solid white;
    width:500px;
    margin:auto;
    padding:20px;
    background:#333;
}

#bigCard img{
    width:250px;
    image-rendering:pixelated;
}

#characterList{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:30px;
}

.charButton{
    background:#444;
    border:3px solid white;
    color:white;
    padding:10px;
    cursor:pointer;
}

.charButton img{
    width:100px;
    image-rendering:pixelated;
}

.charButton:hover{
    background:#666;
}

#team{
    margin-top:30px;
    font-size:24px;
}

</style>

</head>
<body>

<h1>ぬいぐるみチャンピオンズ</h1>

<div id="bigCard">

<img id="bigImage" src="images/pomu.png">

<h2 id="charName">ポム子</h2>

<p id="charInfo">
進化できるバランス型
</p>

</div>

<div id="characterList">

<div class="charButton" onclick="selectChar('chicken')">
<img src="images/chicken.png">
<br>
チキン
</div>

<div class="charButton" onclick="selectChar('kuu')">
<img src="images/kuu.png">
<br>
くうちゃん
</div>

<div class="charButton" onclick="selectChar('pomu')">
<img src="images/pomu.png">
<br>
ポム子
</div>

<div class="charButton" onclick="selectChar('suika')">
<img src="images/suika.png">
<br>
スイカゼリー
</div>

</div>

<br>

<button onclick="addToTeam()">
チームに追加
</button>

<div id="team">

選択チーム

<ul id="teamList"></ul>

</div>
<br>

<button onclick="startBattle()">
バトル開始
</button>

<div id="battle" style="display:none">

<h2>バトル</h2>

<h3 id="levelText">
レベル 1
</h3>

<h3 id="enemyName"></h3>

<div style="width:300px;border:2px solid white;margin:auto">
<div id="enemyHpBar"
style="height:20px;background:red;width:100%">
</div>
</div>

<p id="enemyHp"></p>

<img id="enemyImg" width="180">

<hr>

<img id="playerImg" width="180">

<h3 id="playerName"></h3>

<div style="width:300px;border:2px solid white;margin:auto">
<div id="playerHpBar"
style="height:20px;background:lime;width:100%">
</div>
</div>

<p id="playerHp"></p>

<br>

<div id="moves">

<button onclick="useMove1()" id="move1">
技1
</button>

<button onclick="useMove2()" id="move2">
技2
</button>

<button onclick="useMove3()" id="move3">
技3
</button>

<button onclick="useMove4()" id="move4">
技4
</button>

</div>
<br><br>

<button onclick="switchCharacter()">
交代
</button>

<p id="log"></p>

</div>

</div>
<script>
const characters = {

chicken:{
name:"将来有望なケンタッキーのチキン",
img:"images/chicken.png",
info:"コケコッコーで3ターン強化",
hp:95,
atk:22
},

kuu:{
name:"くうちゃん",
img:"images/kuu.png",
info:"おもりキック超高火力",
hp:90,
atk:30
},

pomu:{
name:"ポム子",
img:"images/pomu.png",
info:"へんしんぼうしで進化",
hp:100,
atk:18
},

pomu_hat:{
name:"ポム子（帽子あり）",
img:"images/pomu_hat.png",
info:"ぼうしミサイル",
hp:130,
atk:28
},

suika:{
name:"スイカゼリー",
img:"images/suika.png",
info:"殻の雨・殻盾を使う",
hp:120,
atk:15
},

chicken:{
name:"将来有望なケンタッキーのチキン",
type:"とり",
...
},

kuu:{
name:"くうちゃん",
type:"けもの",
...
},

pomu:{
name:"ポム子",
type:"まほう",
...
},

suika:{
name:"スイカゼリー",
type:"みず",
...
},

};
let current="pomu";
let team=[];

function selectChar(id){

current=id;

document.getElementById("bigImage").src=
characters[id].img;

document.getElementById("charName").innerText=
characters[id].name;

document.getElementById("charInfo").innerText=
characters[id].info;
}

function addToTeam(){

if(team.length>=3){

alert("3体選んでいます");

return;
}

team.push(current);

drawTeam();
}

function drawTeam(){

let html="";

team.forEach(c=>{

html+=
`<li>${characters[c].name}
 Lv.${levels[c]}</li>`;

});

document.getElementById("teamList").innerHTML=
html;

}
let player;
let enemy;

let skipTurn=false;

let currentIndex=0;

let shieldTurns=0;

let enemyTeam=[];

let enemyIndex=0;

let teamData=[];

let poisonTurns=0;

let buffTurns=0;


let enemyBuffTurns=0;

let playerPoisonTurns=0;

let level=1;

let levels={
chicken:1,
kuu:1,
pomu:1,
suika:1
};

function startBattle(){

level=1;

if(team.length!==3){

alert("3体選んでください");

return;
}

document.getElementById("battle").style.display="block";
currentIndex=0;
teamData=[];

team.forEach(c=>{

let p=
JSON.parse(
JSON.stringify(
characters[c]
));

let lv=levels[c];

p.hp+= (lv-1)*10;
p.atk+= (lv-1)*3;

p.maxHp=p.hp;
p.maxHp=p.hp;

teamData.push(p);

});

player=teamData[0];

enemyTeam=["chicken","kuu","suika"];

enemyIndex=0;

enemy=
JSON.parse(
JSON.stringify(
characters[
enemyTeam[enemyIndex]
]
));
player.maxHp=player.hp;
enemy.maxHp=enemy.hp;

drawBattle();
}

function drawBattle(){

let playerDisplayName=player.name;

if(playerPoisonTurns>0){

playerDisplayName+=" ☠";

}

document.getElementById("playerName").innerText=
playerDisplayName;

if(poisonTurns>0){

let enemyDisplayName=enemy.name;

if(enemyBuffTurns>0){

enemyDisplayName+=" 🔥";

}

if(poisonTurns>0){

enemyDisplayName+=" ☠";

}

document.getElementById("enemyName").innerText=
enemyDisplayName;
}
else{

document.getElementById("enemyName").innerText=
enemy.name;

if(poisonTurns>0){

document.getElementById("enemyName").innerText=
enemy.name+" ☠";

document.getElementById("enemyName").style.color=
"violet";

}
else{

document.getElementById("enemyName").innerText=
enemy.name;

document.getElementById("enemyName").style.color=
"white";

}

document.getElementById("levelText").innerText=
"レベル "+level;

}

document.getElementById("playerImg").src=
player.img;

document.getElementById("enemyImg").src=
enemy.img;

document.getElementById("playerHp").innerText=
player.hp+" / "+player.maxHp;

document.getElementById("enemyHp").innerText=
enemy.hp+" / "+enemy.maxHp;

document.getElementById("playerHpBar").style.width=
(player.hp/player.maxHp*100)+"%";

document.getElementById("enemyHpBar").style.width=
(enemy.hp/enemy.maxHp*100)+"%";

document.getElementById("enemyHpBar").style.width=
(enemy.hp/enemy.maxHp*100)+"%";

let playerPercent=
player.hp/player.maxHp*100;

if(playerPercent>50){

document.getElementById("playerHpBar").style.background=
"lime";

}
else if(playerPercent>20){

document.getElementById("playerHpBar").style.background=
"yellow";

}
else{

document.getElementById("playerHpBar").style.background=
"red";

}

let enemyPercent=
enemy.hp/enemy.maxHp*100;

if(enemyPercent>50){

document.getElementById("enemyHpBar").style.background=
"lime";

}
else if(enemyPercent>20){

document.getElementById("enemyHpBar").style.background=
"yellow";

}
else{

document.getElementById("enemyHpBar").style.background=
"red";

}

updateMoves();
}

function attack(){

if(skipTurn){

skipTurn=false;

document.getElementById("log").innerText=
"くうちゃんは休んでいる！";

enemyTurn();

return;
}

enemy.hp -= player.atk;

if(enemy.hp<0)
enemy.hp=0;

document.getElementById("log").innerText=
player.name+"の攻撃！";

drawBattle();

if(enemy.hp<=0){

nextEnemy();

return;

}

enemyTurn();
}
function specialMove(){

if(player.name==="ポム子"){

let oldHp=player.hp;

player=teamData[currentIndex];

player.maxHp=player.hp;
player.hp=oldHp;

if(player.hp>player.maxHp)
player.hp=player.maxHp;

document.getElementById("log").innerText=
"ポム子は進化した！";

drawBattle();

return;
}
else if(player.name==="将来有望なケンタッキーのチキン"){

buffTurns=3;

document.getElementById("log").innerText=
"コケコッコー！3ターン強化！";

drawBattle();

enemyTurn();

return;

}
else if(player.name==="くうちゃん"){

enemy.hp-=70;

skipTurn=true;

document.getElementById("log").innerText=
"おもりキック！次のターン休み！";

}

else if(player.name==="スイカゼリー"){

player.hp+=30;

if(player.hp>player.maxHp)
player.hp=player.maxHp;

enemy.hp-=20;

poisonTurns=3;

document.getElementById("log").innerText=
"殻の雨！相手は毒になった！";
}

if(enemy.hp<0)
enemy.hp=0;

drawBattle();

if(enemy.hp<=0){

nextEnemy();

return;

}

enemyTurn();

}function nextEnemy(){

let currentChar=team[currentIndex];

levels[currentChar]++;

document.getElementById("log").innerText=
characters[currentChar].name+
" はレベル"+
levels[currentChar]+
"になった！";

level++;

player.maxHp+=10;
player.hp+=10;
player.atk+=3;

document.getElementById("log").innerText=
"レベル"+level+"！ HP+10 攻撃+3！";

enemyIndex++;

if(enemyIndex>=enemyTeam.length){

alert("勝利！！");

return;

}
enemy=
JSON.parse(
JSON.stringify(
characters[
enemyTeam[enemyIndex]
]
));

enemy.maxHp=enemy.hp;

document.getElementById("log").innerText=
enemy.name+"登場！";

drawBattle();

}
function quickAttack(){

enemy.hp-=10;

document.getElementById("log").innerText=
"はやうち！";

drawBattle();

enemyTurn();
}

function healMove(){

player.hp+=20;

if(player.hp>player.maxHp)
player.hp=player.maxHp;

document.getElementById("log").innerText=
"回復した！";

drawBattle();

enemyTurn();
}
function enemyTurn(){

if(playerPoisonTurns>0){

player.hp-=5;

playerPoisonTurns--;

if(player.hp<0)
player.hp=0;

document.getElementById("log").innerText=
"自分は毒ダメージを受けた！";

drawBattle();

if(player.hp<=0){

alert("敗北...");

return;

}

}

let damage=enemy.atk;

if(enemyBuffTurns>0){

damage*=2;

enemyBuffTurns--;

}

let move=Math.floor(Math.random()*5);

if(poisonTurns>0){

enemy.hp-=5;

poisonTurns--;

if(enemy.hp<0)
enemy.hp=0;

document.getElementById("log").innerText=
"毒ダメージ！";

drawBattle();

if(enemy.hp<=0){

nextEnemy();

return;

}

}

if(enemy.name==="将来有望なケンタッキーのチキン" && move===0){

enemyBuffTurns=3;

document.getElementById("log").innerText=
"敵チキンのコケコッコー！";

drawBattle();

return;

}
if(enemy.name==="くうちゃん" && move===0){

player.hp-=70;

if(player.hp<0)
player.hp=0;

document.getElementById("log").innerText=
"敵くうちゃんのおもりキック！";

drawBattle();

return;

}

if(enemy.name==="スイカゼリー" && move===0){

shieldTurns=2;

document.getElementById("log").innerText=
"敵スイカの殻盾！";

drawBattle();

return;

}

if(enemy.name==="スイカゼリー" && move===1){

playerPoisonTurns=3;

document.getElementById("log").innerText=
"敵スイカの殻の雨！";

drawBattle();

return;

}


if(shieldTurns>0){

damage=Math.floor(damage/2);

shieldTurns--;

}

player.hp-=damage;

if(player.hp<0)
player.hp=0;

document.getElementById("log").innerText=
enemy.name+"の攻撃！";

drawBattle();

if(player.hp<=0){

if(currentIndex<teamData.length-1){

currentIndex++;

player=teamData[currentIndex];

document.getElementById("log").innerText=
player.name+"登場！";

drawBattle();

}
else{

alert("敗北...");

}

}

}
function switchCharacter(){

if(currentIndex>=team.length-1){

alert("これ以上交代できない");

return;
}

currentIndex++;

player=teamData[currentIndex];

player.maxHp=player.hp;

drawBattle();

document.getElementById("log").innerText=
player.name+"登場！";

enemyTurn();

}
function useMove1(){

let damage=20;

let critical=false;

if(Math.random()<0.2){

damage*=2;

critical=true;

}

if(buffTurns>0){

damage*=2;

buffTurns--;

}

let bonus=
getTypeBonus(player,enemy);

damage=
Math.floor(damage*bonus);

if(bonus>1){

document.getElementById("log").innerText=
"こうかはばつぐんだ！";

}

else if(bonus<1){

document.getElementById("log").innerText=
"こうかはいまひとつだ...";

}

enemy.hp-=damage;

if(critical){

document.getElementById("log").innerText=
"クリティカル！ "+damage+"ダメージ！";

}
else{

document.getElementById("log").innerText=
damage+"ダメージ！";

}

drawBattle();

if(enemy.hp<=0){

nextEnemy();

return;

}

enemyTurn();

}


function useMove2(){

let damage=35;

let critical=false;

if(Math.random()<0.2){

damage*=2;

critical=true;

}

if(buffTurns>0){

damage*=2;

buffTurns--;

}

let bonus=
getTypeBonus(player,enemy);

damage=
Math.floor(damage*bonus);

if(bonus>1){

document.getElementById("log").innerText=
"こうかはばつぐんだ！";

}

else if(bonus<1){

document.getElementById("log").innerText=
"こうかはいまひとつだ...";

}

enemy.hp-=damage;

if(critical){

document.getElementById("log").innerText=
"クリティカル！ "+damage+"ダメージ！";

}
else{

document.getElementById("log").innerText=
damage+"ダメージ！";

}

drawBattle();

if(enemy.hp<=0){

nextEnemy();

return;

}

enemyTurn();

}

function useMove3(){

specialMove();

}

function useMove4(){

if(player.name==="スイカゼリー"){

shieldTurns=3;

document.getElementById("log").innerText=
"スイカの殻盾！";

}
else{

document.getElementById("log").innerText=
"まもる！";

}

enemyTurn();

}

function getTypeBonus(attacker, defender){

if(attacker.type==="とり" && defender.type==="けもの")
return 1.5;

if(attacker.type==="けもの" && defender.type==="まほう")
return 1.5;

if(attacker.type==="まほう" && defender.type==="みず")
return 1.5;

if(attacker.type==="みず" && defender.type==="とり")
return 1.5;

if(defender.type==="とり" && attacker.type==="けもの")
return 0.7;

if(defender.type==="けもの" && attacker.type==="まほう")
return 0.7;

if(defender.type==="まほう" && attacker.type==="みず")
return 0.7;

if(defender.type==="みず" && attacker.type==="とり")
return 0.7;

return 1;

}

function updateMoves(){

if(player.name==="将来有望なケンタッキーのチキン"){

move1.innerText="つつく";
move2.innerText="はばたく";
move3.innerText="コケコッコー";
move4.innerText="まもる";

}

else if(player.name==="くうちゃん"){

move1.innerText="キック";
move2.innerText="ダッシュキック";
move3.innerText="おもりキック";
move4.innerText="まもる";

}

else if(player.name==="ポム子"){

move1.innerText="たいあたり";
move2.innerText="ジャンプ";
move3.innerText="へんしんぼうし";
move4.innerText="まもる";

}

else if(player.name==="ポム子（帽子あり）"){

move1.innerText="ミサイル";
move2.innerText="ダブルミサイル";
move3.innerText="ぼうしミサイル";
move4.innerText="まもる";

}

else if(player.name==="スイカゼリー"){

move1.innerText="ゼリーアタック";
move2.innerText="ぷるぷる";
move3.innerText="殻の雨";
move4.innerText="殻盾";

}

}
</script>

</body>
</html>
